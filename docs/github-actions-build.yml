name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build Emby plugin
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: emby-stash-plugin
          if-no-files-found: error
          path: |
            artifacts/Emby.Plugins.Stash-auto-poster.tar.gz
            artifacts/SHA256SUMS

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build proxy image and binary
        run: ./scripts/build-proxy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stash-poster-proxy-linux-amd64
          if-no-files-found: error
          path: artifacts/proxy/
